[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-agent"
version = "0.1.0"
description = "Proactive home steward agent for Home Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "websockets>=13.0,<16.0",
    "structlog>=24.1,<26.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "argon2-cffi>=23.1,<26.0",
    "cryptography>=43.0",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.9,<1.0",
    "lark-oapi>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
