services:
  agent:
    build: ./backend
    container_name: home-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/agent.db
      AUTO_CREATE_SCHEMA: "false"
    ports:
      - "8233:8233"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8233/healthz')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
